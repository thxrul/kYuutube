<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kYuutube · Audio diagnostics</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main id="main"><header><a href="index.html">Back to kYuutube</a><h1>Audio diagnostics</h1><p>Play a configured local sample to test the audio engine.</p></header>
<section class="player" aria-labelledby="track"><div class="art" aria-hidden="true">♪</div><div><p class="eyebrow">Local sample</p><h2 id="track">Audio test</h2><p id="state" role="status" aria-live="polite">Ready to test</p></div>
<div class="controls"><button id="play">Play sample</button><button id="pause" disabled>Pause</button></div>
<label for="seek">Position <output id="elapsed">0:00</output></label><input id="seek" type="range" min="0" max="1" step="0.1" value="0" disabled>
<label for="volume">Volume</label><input id="volume" type="range" min="0" max="100" value="70" disabled></section>
</main></body></html>
