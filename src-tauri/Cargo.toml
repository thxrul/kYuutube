[package]
name = "kyuutube-desktop-spike"
version = "0.0.1"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
webbrowser = "1"
kyuutube-youtube-account = { path = "../crates/youtube-account" }
kyuutube-audio-spike = { path = "../crates/audio-spike" }
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_16"] }
