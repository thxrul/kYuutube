[package]
name = "kyuutube-youtube-account"
version = "0.0.2"
edition = "2021"
publish = false

[dependencies]
kyuutube-audio-spike = { path = "../audio-spike" }
time = "0.3"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
webbrowser = "1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
