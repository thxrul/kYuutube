name: Publish verified alpha diagnostics

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-alpha-1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ALPHA_TAG: v0.0.1-alpha.1
      SOURCE_SHA: 508ecab573257b3c63eac9a6398397d039c35d37
      BUILD_RUN: '39502246120'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify successful source build and download artifacts
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN" --json conclusion,headSha > build-run.json
          python3 - <<'PY'
          import json, os
          result = json.load(open('build-run.json'))
          assert result['conclusion'] == 'success'
          assert result['headSha'] == os.environ['SOURCE_SHA']
          PY
          gh run download "$BUILD_RUN" --dir artifacts
          python3 tools/package_alpha.py artifacts release-assets
      - name: Upload complete draft then publish as prerelease
        run: |
          set -euo pipefail
          gh release create "$ALPHA_TAG" --target "$SOURCE_SHA" --draft --prerelease --latest=false --title 'kYuutube v0.0.1-alpha.1 — Native feasibility preview' --notes-file docs/releases/v0.0.1-alpha.1.md
          gh release upload "$ALPHA_TAG" release-assets/*
          gh release edit "$ALPHA_TAG" --draft=false --prerelease --latest=false
      - name: Verify public assets by downloading them
        run: |
          set -euo pipefail
          gh release view "$ALPHA_TAG" --json isDraft,isPrerelease,assets,url > published-release.json
          python3 - <<'PY'
          import json
          release = json.load(open('published-release.json'))
          assert not release['isDraft'] and release['isPrerelease']
          assert len(release['assets']) == 5
          print(release['url'])
          PY
          gh release download "$ALPHA_TAG" --dir published-assets
          cd published-assets
          sha256sum --check SHA256SUMS.txt
