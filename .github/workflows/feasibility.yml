name: Feasibility builds (not a release)

on:
  push:
    paths:
      - '.github/workflows/feasibility.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'src-tauri/**'
      - 'web/**'
      - 'tests/**'
      - 'tools/package_spike.py'
      - 'tools/make_sample.py'
      - 'tools/Measure-ProcessTree.ps1'
      - 'tools/package_alpha.py'
      - 'docs/FEASIBILITY_BUILD.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      # Publisher-owned installed-app registration, never user tokens. Fork/PR
      # builds are intentionally unprovisioned previews.
      KYUUTUBE_GOOGLE_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.KYUUTUBE_GOOGLE_CLIENT_ID || '' }}
      KYUUTUBE_GOOGLE_CLIENT_SECRET: ${{ github.event_name != 'pull_request' && secrets.KYUUTUBE_GOOGLE_CLIENT_SECRET || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup target add --toolchain 1.92.0 ${{ matrix.target }}
      - name: Reuse Rust dependencies and build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kyuutube-${{ runner.os }}-${{ matrix.target }}-rust-1.92-${{ hashFiles('Cargo.lock') }}
          restore-keys: kyuutube-${{ runner.os }}-${{ matrix.target }}-rust-1.92-
      - name: Linux build and native-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libmpv2
      - name: Account screen state tests
        shell: bash
        run: |
          node --test tests/account-ui.test.mjs tests/music-ui.test.mjs tests/official-ui.test.mjs
          python3 -m unittest discover -s tests -p test_release_provisioning.py
      - name: Generate local test sample
        shell: bash
        run: python3 tools/make_sample.py
      - name: Compile the feasibility executables
        shell: bash
        run: cargo +1.92.0 build --release --locked --workspace --target ${{ matrix.target }}
      - name: Account OAuth tests on native targets (no real Google credentials)
        shell: bash
        run: |
          if [ "$(rustc +1.92.0 -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}' ]; then
            cargo +1.92.0 test --locked -p kyuutube-desktop-spike -p kyuutube-youtube-account --target ${{ matrix.target }}
          else
            echo 'Cross-compiled target: account tests require a matching runner.'
          fi
      - name: Linux native integration tests
        if: runner.os == 'Linux'
        shell: bash
        run: cargo +1.92.0 test --locked -p kyuutube-audio-spike --target ${{ matrix.target }}
      - name: Validate Windows process-tree measurement helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $child = Start-Process -FilePath (Join-Path $PSHOME 'pwsh.exe') -ArgumentList '-NoProfile -NonInteractive -Command Start-Sleep 30' -PassThru
          try {
            $resultPath = Join-Path $env:RUNNER_TEMP 'process-tree-check.json'
            & .\tools\Measure-ProcessTree.ps1 -RootProcessId $PID -Seconds 5 -OutputPath $resultPath
            $result = Get-Content -Raw $resultPath | ConvertFrom-Json
            if ($result.max_process_count -lt 2 -or $result.rss_median_mib -le 0) { throw 'Expected root and child measurements' }
          } finally {
            Stop-Process -Id $child.Id -ErrorAction SilentlyContinue
          }
      - name: Assemble diagnostic artifact (no bundled mpv)
        shell: bash
        run: python3 tools/package_spike.py ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feasibility-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
